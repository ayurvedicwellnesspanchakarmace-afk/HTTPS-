<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AABA Admin</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#f6faf5;color:#25342a}header{background:linear-gradient(135deg,#175c32,#5a974d);color:white;position:sticky;top:0;z-index:10}.nav{max-width:1200px;margin:auto;padding:13px 18px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:29px;font-weight:900}.nav small{display:block}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.white{background:white;color:#175c32}.green{background:#1c6838;color:white}.red{background:#b42318;color:white}.wrap{max-width:1200px;margin:auto;padding:24px 18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}.card{background:white;border:1px solid #e1e9df;border-radius:17px;overflow:hidden;box-shadow:0 5px 20px #17351a12}.photo{height:210px;background:#eaf4e8;display:flex;align-items:center;justify-content:center;font-size:65px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:15px}.price{font-size:21px;font-weight:900;color:#176334}.mrp{text-decoration:line-through;color:#888;font-size:14px;margin-left:6px}.offer{background:#fff1d8;color:#9b5c00;padding:4px 8px;border-radius:20px;font-size:12px;display:inline-block}.full{width:100%;margin-top:10px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;padding:18px}.box{background:white;max-width:700px;margin:3vh auto;border-radius:18px;padding:22px;max-height:94vh;overflow:auto}.close{float:right;border:0;background:none;font-size:28px;cursor:pointer}input,textarea{width:100%;padding:12px;border:1px solid #ccd8cc;border-radius:9px;margin:5px 0 12px}textarea{min-height:80px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{background:white;border:1px solid #cad7c9;padding:10px 15px;border-radius:22px;cursor:pointer}.tab.active{background:#175c32;color:white}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:13px}.stat{background:white;padding:18px;border-radius:15px}.stat b{font-size:26px;color:#175c32}.order{background:white;border:1px solid #e0e8df;border-radius:15px;padding:16px;margin:12px 0}.line{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:9px 0}.badge{background:#e8f4e8;border-radius:20px;padding:5px 9px;font-size:12px}.note{font-size:12px;color:#667}@media(max-width:600px){.nav{align-items:flex-start}}
</style></head><body>
<header><div class="nav"><div><div class="logo">आबा Admin Panel</div><small>अपनी पूरी दुकान यहाँ से चलाएँ</small></div><a href="index.html" class="btn white">🛍️ Store खोलें</a></div></header>
<main class="wrap"><div class="tabs"><button class="tab active" onclick="tab('dash',this)">📊 Dashboard</button><button class="tab" onclick="tab('prod',this)">🌿 Products</button><button class="tab" onclick="tab('orders',this)">📦 Orders</button></div>
<section id="dash"><h2>Dashboard</h2><div class="stats"><div class="stat">Products<br><b id="sp">0</b></div><div class="stat">Orders<br><b id="so">0</b></div><div class="stat">Sales<br><b>₹<span id="ss">0</span></b></div></div><p class="note">यह वेबसाइट browser में data save करती है। अलग फोन/कंप्यूटर पर वही data अपने आप नहीं आएगा।</p></section>
<section id="prod" style="display:none"><div class="line"><h2>🌿 Products</h2><button class="btn green" onclick="newProduct()">＋ Product Add</button></div><div id="plist" class="grid"></div></section>
<section id="orders" style="display:none"><h2>📦 Order Listing</h2><div id="olist"></div></section></main>
<div id="pm" class="modal"><div class="box"><button class="close" onclick="closeP()">×</button><h2>Product Add / Edit</h2><input type="hidden" id="id"><label>Product Name</label><input id="name"><label>MRP ₹</label><input id="mrp" type="number"><label>Offer / Selling Price ₹</label><input id="price" type="number"><label>Stock Quantity</label><input id="stock" type="number"><label>Category</label><input id="cat"><label>Product Details</label><textarea id="desc"></textarea><label>Product Photo</label><input id="photo" type="file" accept="image/*"><div id="preview"></div><button class="btn green full" onclick="saveProduct()">💾 Product Save करें</button></div></div>
<script>
const starter=[{id:1,name:"Zandu RhumasyL Maxx Liniment (100ml)",mrp:305,price:205,stock:300,category:"Pain Relief / Ayurvedic",desc:"100ml Liniment • MRP ₹305 • Offer Price ₹205 • Stock 300 pcs",image:"product.jpg"}];
function ps(){let x=JSON.parse(localStorage.getItem("aaba_products")||"null");if(x)return x;localStorage.setItem("aaba_products",JSON.stringify(starter));return starter}function saveps(x){localStorage.setItem("aaba_products",JSON.stringify(x))}
function tab(id,b){["dash","prod","orders"].forEach(x=>document.getElementById(x).style.display=x==id?"block":"none");document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");if(id=="prod")listProducts();if(id=="orders")listOrders();dashboard()}
function dashboard(){let p=ps(),o=JSON.parse(localStorage.getItem("aaba_orders")||"[]");sp.textContent=p.length;so.textContent=o.length;ss.textContent=o.reduce((s,x)=>s+x.total,0)}
function listProducts(){plist.innerHTML=ps().map(p=>`<article class="card"><div class="photo">${p.image?`<img src="${p.image}">`:"🌿"}</div><div class="body"><h3>${p.name}</h3><p class="note">${p.desc||""}</p><div><span class="price">₹${p.price}</span> ${p.mrp>p.price?`<span class="mrp">₹${p.mrp}</span> <span class="offer">${Math.round((1-p.price/p.mrp)*100)}% OFF</span>`:""}</div><p class="note">Stock: ${p.stock} • ${p.category||""}</p><button class="btn" onclick="edit(${p.id})">✏️ Edit</button> <button class="btn red" onclick="del(${p.id})">🗑️ Delete</button></div></article>`).join("")}
function newProduct(){id.value="";name.value="";mrp.value="";price.value="";stock.value="";cat.value="";desc.value="";photo.value="";preview.innerHTML="";pm.style.display="block"}
function closeP(){pm.style.display="none"}
function edit(i){let p=ps().find(x=>x.id==i);newProduct();id.value=p.id;name.value=p.name;mrp.value=p.mrp;price.value=p.price;stock.value=p.stock;cat.value=p.category||"";desc.value=p.desc||"";preview.innerHTML=p.image?`<img src="${p.image}" style="max-width:160px;border-radius:10px">`:""}
photo.onchange=()=>{let f=photo.files[0];if(f){let r=new FileReader();r.onload=()=>preview.innerHTML=`<img src="${r.result}" style="max-width:160px;border-radius:10px">`;r.readAsDataURL(f)}}
function saveProduct(){if(!name.value||!price.value)return alert("Product name और Offer Price भरें।");let arr=ps(),pid=id.value?Number(id.value):Date.now(),old=arr.find(x=>x.id==pid);let finish=img=>{let p={id:pid,name:name.value,mrp:Number(mrp.value||0),price:Number(price.value),stock:Number(stock.value||0),category:cat.value,desc:desc.value,image:img||old?.image||""};let ix=arr.findIndex(x=>x.id==pid);if(ix>=0)arr[ix]=p;else arr.unshift(p);saveps(arr);closeP();listProducts();dashboard();alert("Product Save हो गया।")};if(photo.files[0]){let r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(photo.files[0])}else finish()}
function del(i){if(confirm("यह Product delete करें?")){saveps(ps().filter(p=>p.id!=i));listProducts();dashboard()}}
function listOrders(){let o=JSON.parse(localStorage.getItem("aaba_orders")||"[]");olist.innerHTML=o.map(x=>`<div class="order"><div class="line"><b>Order #${x.id}</b><span class="badge">${x.status}</span></div><p><b>${x.customer.name}</b><br>📞 ${x.customer.phone}<br>📍 ${x.customer.address}</p>${x.items.map(i=>`<div class="line"><span>${i.name}</span><b>₹${i.price}</b></div>`).join("")}<h3>कुल ₹${x.total}</h3><button class="btn" onclick="status(${x.id})">🔄 Status</button> <button class="btn red" onclick="delOrder(${x.id})">Delete</button></div>`).join("")||"<p>अभी कोई order नहीं आया।</p>"}
function status(i){let o=JSON.parse(localStorage.getItem("aaba_orders")||"[]"),x=o.find(a=>a.id==i),s=prompt("Status: नया / Confirmed / Packed / Shipped / Delivered",x.status);if(s){x.status=s;localStorage.setItem("aaba_orders",JSON.stringify(o));listOrders();dashboard()}}
function delOrder(i){if(confirm("Order delete करें?")){let o=JSON.parse(localStorage.getItem("aaba_orders")||"[]").filter(x=>x.id!=i);localStorage.setItem("aaba_orders",JSON.stringify(o));listOrders();dashboard()}}
dashboard();
</script></body></html>
