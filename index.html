<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AABA | आबा Ayurvedic Store</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#f6faf5;color:#25342a}header{background:linear-gradient(135deg,#175c32,#5a974d);color:white;position:sticky;top:0;z-index:10}.nav{max-width:1200px;margin:auto;padding:13px 18px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:29px;font-weight:900}.nav small{display:block}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.white{background:white;color:#175c32}.green{background:#1c6838;color:white}.red{background:#b42318;color:white}.wrap{max-width:1200px;margin:auto;padding:24px 18px}.hero{background:linear-gradient(135deg,#e5f4e4,#fff);padding:44px 18px}.hero h1{font-size:42px;color:#175c32;margin:0 0 8px}.hero p{font-size:18px;line-height:1.7}.search{width:100%;padding:13px;border:1px solid #cbd8c9;border-radius:12px;margin:10px 0 22px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}.card{background:white;border:1px solid #e1e9df;border-radius:17px;overflow:hidden;box-shadow:0 5px 20px #17351a12}.photo{height:210px;background:#eaf4e8;display:flex;align-items:center;justify-content:center;font-size:65px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:15px}.price{font-size:21px;font-weight:900;color:#176334}.mrp{text-decoration:line-through;color:#888;font-size:14px;margin-left:6px}.offer{background:#fff1d8;color:#9b5c00;padding:4px 8px;border-radius:20px;font-size:12px;display:inline-block}.full{width:100%;margin-top:10px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;padding:18px}.box{background:white;max-width:700px;margin:3vh auto;border-radius:18px;padding:22px;max-height:94vh;overflow:auto}.close{float:right;border:0;background:none;font-size:28px;cursor:pointer}input,textarea,select{width:100%;padding:12px;border:1px solid #ccd8cc;border-radius:9px;margin:5px 0 12px}textarea{min-height:80px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{background:white;border:1px solid #cad7c9;padding:10px 15px;border-radius:22px;cursor:pointer}.tab.active{background:#175c32;color:white}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:13px}.stat{background:white;padding:18px;border-radius:15px;box-shadow:0 3px 15px #17351a12}.stat b{font-size:26px;color:#175c32}.order{background:white;border:1px solid #e0e8df;border-radius:15px;padding:16px;margin:12px 0}.line{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:9px 0}.badge{background:#e8f4e8;border-radius:20px;padding:5px 9px;font-size:12px}.note{font-size:12px;color:#667}.adminlink{margin-left:8px}@media(max-width:600px){.hero h1{font-size:31px}.nav{align-items:flex-start}}
</style>
</head>
<body>
<header><div class="nav"><div><div class="logo">आबा | AABA</div><small>Ayurvedic Products Store</small></div><button class="btn white" onclick="openCart()">🛒 Cart <span id="cartCount">0</span></button></div></header>
<section class="hero"><div class="wrap"><h1>आबा आयुर्वेदिक स्टोर</h1><p>आयुर्वेदिक उत्पादों की आसान ऑनलाइन खरीदारी। MRP, Offer Price और उपलब्धता साफ-साफ देखें।</p><button class="btn green" onclick="document.getElementById('products').scrollIntoView()">🌿 Products देखें</button></div></section>
<main class="wrap"><input class="search" id="search" placeholder="🔎 Product खोजें..." oninput="renderStore()"><div id="products" class="grid"></div></main>
<footer style="background:#173d25;color:white;text-align:center;padding:28px">आबा | AABA Ayurvedic Store<br><small>WhatsApp: 8319425837 • UPI: 9993788814@ybl</small></footer>
<div id="cartModal" class="modal"><div class="box"><button class="close" onclick="closeModal('cartModal')">×</button><h2>🛒 आपका Cart</h2><div id="cartList"></div><h3>कुल: ₹<span id="cartTotal">0</span></h3><input id="cname" placeholder="नाम"><input id="cphone" placeholder="मोबाइल नंबर"><textarea id="caddress" placeholder="पूरा डिलीवरी पता"></textarea><button class="btn green full" onclick="orderWhatsApp()">📱 WhatsApp पर Order करें</button><button class="btn green full" onclick="upiPay()">💳 UPI से Payment करें</button></div></div>
<script>
const WA="918319425837",UPI="9993788814@ybl";let cart=[];
const starter=[{id:1,name:"Zandu RhumasyL Maxx Liniment (100ml)",mrp:305,price:205,stock:300,category:"Pain Relief / Ayurvedic",desc:"100ml Liniment • MRP ₹305 • Offer Price ₹205 • Stock 300 pcs",image:"product.jpg"}];
function getP(){let x=localStorage.getItem("aaba_products");if(x)return JSON.parse(x);localStorage.setItem("aaba_products",JSON.stringify(starter));return starter}
function saveP(x){localStorage.setItem("aaba_products",JSON.stringify(x))}
function renderStore(){let q=(document.getElementById("search").value||"").toLowerCase(),ps=getP().filter(p=>(p.name+" "+p.category+" "+p.desc).toLowerCase().includes(q)&&p.stock>0);document.getElementById("products").innerHTML=ps.map(p=>`<article class="card"><div class="photo">${p.image?`<img src="${p.image}">`:"🌿"}</div><div class="body"><h3>${p.name}</h3><p class="note">${p.desc||""}</p><div><span class="price">₹${p.price}</span>${p.mrp>p.price?` <span class="mrp">₹${p.mrp}</span>`:""} ${p.mrp>p.price?`<span class="offer">${Math.round((1-p.price/p.mrp)*100)}% OFF</span>`:""}</div><p class="note">Stock: ${p.stock}</p><button class="btn green full" onclick="addCart(${p.id})">🛒 Cart में जोड़ें</button></div></article>`).join("")||"<p>अभी कोई product उपलब्ध नहीं है। Admin Panel से product जोड़ें।</p>"}
function addCart(id){let p=getP().find(x=>x.id==id);if(p)cart.push(p);document.getElementById("cartCount").textContent=cart.length;openCart()}
function openCart(){document.getElementById("cartModal").style.display="block";document.getElementById("cartList").innerHTML=cart.map(p=>`<div class="line"><span>${p.name}</span><b>₹${p.price}</b></div>`).join("")||"<p>Cart खाली है।</p>";document.getElementById("cartTotal").textContent=cart.reduce((s,p)=>s+p.price,0)}
function closeModal(id){document.getElementById(id).style.display="none"}
function makeOrder(){let o={id:Date.now(),date:new Date().toLocaleString("hi-IN"),customer:{name:cname.value,phone:cphone.value,address:caddress.value},items:cart.map(p=>({id:p.id,name:p.name,price:p.price})),total:cart.reduce((s,p)=>s+p.price,0),status:"नया"};let os=JSON.parse(localStorage.getItem("aaba_orders")||"[]");os.unshift(o);localStorage.setItem("aaba_orders",JSON.stringify(os));return o}
function orderWhatsApp(){if(!cart.length)return alert("Cart खाली है।");let o=makeOrder(),m=`आबा AABA Order%0Aनाम: ${o.customer.name}%0Aमोबाइल: ${o.customer.phone}%0Aपता: ${o.customer.address}%0A%0A`;o.items.forEach(x=>m+=`• ${x.name} - ₹${x.price}%0A`);m+=`कुल: ₹${o.total}`;window.open("https://wa.me/"+WA+"?text="+m,"_blank")}
function upiPay(){if(!cart.length)return alert("Cart खाली है।");let total=cart.reduce((s,p)=>s+p.price,0);makeOrder();location.href=`upi://pay?pa=${UPI}&pn=AABA&am=${total}&cu=INR`}
renderStore();
</script>
</body></html>
